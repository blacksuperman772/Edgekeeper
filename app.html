<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>EdgeKeeper · App</title>
  <link rel="stylesheet" href="/assets/shared.css">
  <style>
    :root {
      --app-bg: #070707;
      --app-surface: #0f0f0d;
      --app-surface-2: #141412;
      --app-line: rgba(232,228,220,.1);
      --app-line-strong: rgba(232,228,220,.16);
      --app-text: #e8e4dc;
      --app-muted: #7a7671;
      --app-gold: #b8a06a;
      --app-green: #6b8c6b;
    }

    /* ── Full-height bounded shell ── */
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden; /* nothing leaks out of the viewport */
      background: var(--app-bg);
      color: var(--app-text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Shell: fixed header + scrollable content + fixed footer */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      /* Safe area for notch / Dynamic Island / home indicator */
      padding-top: env(safe-area-inset-top, 0px);
    }

    /* ── Header ── */
    .app-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 14px;
      border-bottom: 1px solid var(--app-line);
      background: rgba(7,7,7,.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .app-wordmark {
      font: 400 1rem 'Cormorant Garamond', Georgia, serif;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--app-text);
    }
    .app-wordmark span { color: var(--app-gold); }
    .app-avatar {
      width: 38px; height: 38px;
      display: grid; place-items: center;
      border: 1px solid rgba(184,160,106,.45);
      border-radius: 50%;
      color: var(--app-gold);
      font: 500 .68rem 'DM Mono', monospace;
      text-decoration: none;
      background: rgba(184,160,106,.06);
    }

    /* ── Scrollable content ── */
    .app-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background: var(--app-bg);
    }
    /* Subtle ambient gradient that scrolls with content */
    .app-content::before {
      content: "";
      display: block;
      height: 220px;
      background: radial-gradient(ellipse 80% 180px at 50% 0, rgba(184,160,106,.1), transparent);
      margin-bottom: -220px;
      pointer-events: none;
    }

    .app-inner {
      padding: 24px 18px calc(24px + env(safe-area-inset-bottom, 0px));
      max-width: 560px;
      margin: 0 auto;
    }

    /* ── Status row ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 24px;
      color: var(--app-muted);
      font: .6rem 'DM Mono', monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--app-green);
      box-shadow: 0 0 8px var(--app-green);
      flex-shrink: 0;
    }
    .status-dot.offline { background: #9d6c58; box-shadow: none; }

    /* ── Hero ── */
    .hero { margin-bottom: 28px; }
    .hero-label {
      color: var(--app-gold);
      font: .6rem 'DM Mono', monospace;
      letter-spacing: .22em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .hero h1 {
      margin: 0 0 10px;
      font: 400 clamp(2rem,9vw,3.2rem)/.96 'Cormorant Garamond', Georgia, serif;
      letter-spacing: -.01em;
    }
    .hero-sub {
      color: var(--app-muted);
      font-size: .88rem;
      line-height: 1.65;
      margin: 0 0 20px;
    }
    .cta-primary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      min-height: 52px;
      border: 1px solid rgba(184,160,106,.5);
      background: rgba(184,160,106,.07);
      color: var(--app-gold);
      text-decoration: none;
      font: .65rem 'DM Mono', monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .cta-primary:active { background: rgba(184,160,106,.14); }

    /* ── Spaces ── */
    .section { margin-bottom: 6px; }
    .section-label {
      color: var(--app-muted);
      font: .58rem 'DM Mono', monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: 0 0 10px;
      border-bottom: 1px solid var(--app-line);
      margin-bottom: 0;
    }
    .space-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--app-line);
    }
    .space {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-right: 1px solid var(--app-line);
      background: transparent;
      color: var(--app-text);
      text-decoration: none;
      min-height: 110px;
      transition: background .15s;
    }
    .space:last-child { border-right: none; }
    .space:active { background: rgba(255,255,255,.04); }
    .space-mark {
      font: 1.4rem 'Cormorant Garamond', Georgia, serif;
      line-height: 1;
    }
    .space.marcus .space-mark { color: var(--app-gold); }
    .space.theo .space-mark { color: var(--app-green); }
    .space.iris .space-mark { color: rgba(107,140,107,.7); }
    .space-name {
      font: .62rem 'DM Mono', monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .space-sub {
      color: var(--app-muted);
      font-size: .7rem;
      line-height: 1.3;
      margin-top: 2px;
    }

    /* ── Activity ── */
    .activity-section { margin-top: 0; }
    .activity-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0 10px;
      border-bottom: 1px solid var(--app-line);
    }
    .activity-head-label {
      color: var(--app-muted);
      font: .58rem 'DM Mono', monospace;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .activity-head-link {
      color: var(--app-gold);
      font: .58rem 'DM Mono', monospace;
      text-decoration: none;
      letter-spacing: .06em;
    }
    .activity-row {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 60px;
      border-bottom: 1px solid var(--app-line);
      text-decoration: none;
      color: inherit;
    }
    .activity-row:active { background: rgba(255,255,255,.03); }
    .activity-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--app-gold);
      flex-shrink: 0;
    }
    .activity-copy { min-width: 0; flex: 1; }
    .activity-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .84rem;
    }
    .activity-meta {
      margin-top: 3px;
      color: var(--app-muted);
      font: .58rem 'DM Mono', monospace;
      letter-spacing: .04em;
    }
    .activity-arrow { color: var(--app-muted); font-size: .9rem; }
    .quiet { color: var(--app-muted); font: .66rem 'DM Mono', monospace; padding: 18px 0; }

    /* ── Bottom nav ── */
    .app-nav {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid var(--app-line-strong);
      background: rgba(5,5,5,.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .app-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 54px;
      color: var(--app-muted);
      text-decoration: none;
      font: .52rem 'DM Mono', monospace;
      letter-spacing: .06em;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
    }
    .app-tab.active { color: var(--app-gold); }
    .app-tab svg { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div class="app-shell">

    <header class="app-header">
      <div class="app-wordmark">Edge<span>K</span>eeper</div>
      <a class="app-avatar" href="/settings.html" id="avatar" aria-label="Settings">EK</a>
    </header>

    <div class="app-content" role="main">
      <div class="app-inner">

        <div class="status-row">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Connected</span>
        </div>

        <div class="hero">
          <div class="hero-label" id="greeting">Your practice, continued.</div>
          <h1 id="headline">Come back<br>to the work.</h1>
          <p class="hero-sub" id="intro">Your mentor, your rules, and the record of who you are becoming.</p>
          <a class="cta-primary" href="/workspace.html">Enter Marcus's office <span aria-hidden="true">→</span></a>
        </div>

        <div class="section">
          <div class="section-label">Your spaces</div>
          <div class="space-grid">
            <a class="space marcus" href="/workspace.html">
              <span class="space-mark">M</span>
              <span>
                <span class="space-name">Marcus</span>
                <span class="space-sub">Mentor</span>
              </span>
            </a>
            <a class="space theo" href="/my-academy">
              <span class="space-mark">T</span>
              <span>
                <span class="space-name">Theo</span>
                <span class="space-sub">Academy</span>
              </span>
            </a>
            <a class="space iris" href="/chamber">
              <span class="space-mark">I</span>
              <span>
                <span class="space-name">Iris</span>
                <span class="space-sub">Guardian</span>
              </span>
            </a>
          </div>
        </div>

        <div class="activity-section">
          <div class="activity-head">
            <span class="activity-head-label">Recent</span>
            <a class="activity-head-link" href="/workspace.html?panel=messages">All messages</a>
          </div>
          <div id="activity"><div class="quiet">Restoring your record…</div></div>
        </div>

      </div>
    </div>

    <nav class="app-nav" aria-label="App navigation">
      <a class="app-tab active" href="/app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10.5 12 3l9 7.5v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 20v-6h6v6"/></svg>
        Home
      </a>
      <a class="app-tab" href="/workspace.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
        Marcus
      </a>
      <a class="app-tab" href="/my-academy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 10 9-5 9 5-9 5z"/><path d="M7 12v5c3 2 7 2 10 0v-5"/></svg>
        Theo
      </a>
      <a class="app-tab" href="/chamber">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3 20 7v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>
        Iris
      </a>
      <a class="app-tab" href="/settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.1h-2.5v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.5v-2.5h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V5h2.5v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.1v2.5h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </a>
    </nav>

  </div>
  <script>
    // Connection status
    var dot = document.getElementById('status-dot');
    var txt = document.getElementById('status-text');
    function syncConn() {
      var on = navigator.onLine;
      dot.className = 'status-dot' + (on ? '' : ' offline');
      txt.textContent = on ? 'Connected' : 'Offline';
    }
    addEventListener('online', syncConn); addEventListener('offline', syncConn); syncConn();

    // Profile
    fetch('/api/profile', { credentials: 'include' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        var p = data && data.profile; if (!p) return;
        var name = p.display_name || (p.email || '').split('@')[0] || '';
        if (name) {
          document.getElementById('greeting').textContent = 'Welcome back, ' + name + '.';
          document.getElementById('headline').innerHTML = 'Return to<br>the work.';
          document.getElementById('avatar').textContent = name.slice(0, 2).toUpperCase();
        }
      }).catch(function() {});

    // Recent activity
    fetch('/api/messages', { credentials: 'include' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        var msgs = (data && data.messages) || [];
        var el = document.getElementById('activity');
        if (!msgs.length) {
          el.innerHTML = '<div class="quiet">No new messages. Your record is quiet.</div>';
          return;
        }
        el.innerHTML = msgs.slice(0, 3).map(function(m) {
          var content = (m.content || 'A message from your mentor.').replace(/[<>]/g, '');
          var date = new Date(m.created_at).toLocaleDateString();
          return '<a class="activity-row" href="/workspace.html?panel=messages">' +
            '<span class="activity-dot"></span>' +
            '<span class="activity-copy">' +
              '<span class="activity-title">' + content + '</span>' +
              '<span class="activity-meta">' + (m.mentor || 'mentor').toUpperCase() + ' · ' + date + '</span>' +
            '</span>' +
            '<span class="activity-arrow">›</span>' +
          '</a>';
        }).join('');
      }).catch(function() {
        document.getElementById('activity').innerHTML = '<div class="quiet">Activity appears when connected.</div>';
      });
  </script>
</body>
</html>
