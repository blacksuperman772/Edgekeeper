<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#070707">
  <title>EdgeKeeper</title>
  <link rel="stylesheet" href="/assets/shared.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Mono:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --app-bg: #070707;
      --app-surface: #0e0e0c;
      --app-surface-2: #141412;
      --app-surface-3: #1a1a17;
      --app-line: rgba(232,228,220,.08);
      --app-line-strong: rgba(232,228,220,.14);
      --app-text: #e8e4dc;
      --app-text-2: #c4bfb5;
      --app-muted: #6b6762;
      --app-gold: #b8a06a;
      --app-gold-dim: #7a6a45;
      --app-green: #6b8c6b;
      --app-red: #9d6c58;
      --app-iris: #6b8c8c;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
      --mono: 'DM Mono', monospace;
      --nav-h: 58px;
      --header-h: 52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--app-bg);
      color: var(--app-text);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    /* ── Shell ── */
    .shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-top: env(safe-area-inset-top, 0px);
    }

    /* ── Header ── */
    .hdr {
      flex-shrink: 0;
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--app-line);
      background: rgba(7,7,7,.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 10;
    }
    .hdr-left { display: flex; align-items: center; gap: 10px; }
    .hdr-back {
      display: none;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      color: var(--app-gold);
      background: none; border: none;
      cursor: pointer;
    }
    .hdr-back svg { width: 18px; height: 18px; }
    .hdr-back.show { display: flex; }
    .hdr-title {
      font: 400 .88rem var(--serif);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--app-text);
    }
    .hdr-title b { font-weight: 400; color: var(--app-gold); }
    .hdr-sub {
      display: none;
      font: 300 .7rem var(--mono);
      letter-spacing: .06em;
      color: var(--app-muted);
    }
    .hdr-sub.show { display: block; }
    .hdr-right { display: flex; align-items: center; gap: 10px; }
    .hdr-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font: 300 .52rem var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--app-muted);
    }
    .hdr-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--app-green);
      box-shadow: 0 0 6px rgba(107,140,107,.6);
    }
    .hdr-dot.off { background: var(--app-red); box-shadow: none; }
    .hdr-avatar {
      width: 32px; height: 32px;
      display: grid; place-items: center;
      border: 1px solid rgba(184,160,106,.35);
      border-radius: 50%;
      color: var(--app-gold);
      font: 400 .56rem var(--mono);
      text-decoration: none;
      background: rgba(184,160,106,.04);
    }

    /* ── Body ── */
    .body {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* ── Home view ── */
    .home {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .home.off { display: none; }
    .home::before {
      content: "";
      display: block;
      height: 200px;
      background: radial-gradient(ellipse 90% 200px at 50% 0, rgba(184,160,106,.07), transparent);
      margin-bottom: -200px;
      pointer-events: none;
    }
    .home-inner {
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px));
      max-width: 520px;
      margin: 0 auto;
    }

    /* greeting */
    .greet {
      margin-bottom: 28px;
    }
    .greet-label {
      font: 300 .56rem var(--mono);
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--app-gold-dim);
      margin-bottom: 8px;
    }
    .greet h1 {
      font: 300 clamp(1.8rem, 8vw, 2.8rem)/.94 var(--serif);
      letter-spacing: -.01em;
      color: var(--app-text);
      margin-bottom: 8px;
    }
    .greet-sub {
      font-size: .82rem;
      line-height: 1.6;
      color: var(--app-muted);
    }

    /* Spaces grid */
    .spaces {
      border: 1px solid var(--app-line);
      margin-bottom: 2px;
    }
    .spaces-label {
      font: 300 .52rem var(--mono);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--app-muted);
      padding: 10px 14px 8px;
      border-bottom: 1px solid var(--app-line);
    }
    .spaces-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }
    .sp {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 18px 14px;
      border-right: 1px solid var(--app-line);
      background: transparent;
      color: var(--app-text);
      text-decoration: none;
      cursor: pointer;
      border: none;
      text-align: left;
      font-family: inherit;
      transition: background .12s;
      min-height: 100px;
    }
    .sp:last-child { border-right: none; }
    .sp:active { background: rgba(255,255,255,.03); }
    .sp-icon {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border: 1px solid var(--app-line-strong);
      font: 400 1rem var(--serif);
      line-height: 1;
    }
    .sp.marcus .sp-icon { color: var(--app-gold); border-color: rgba(184,160,106,.25); }
    .sp.theo .sp-icon { color: var(--app-green); border-color: rgba(107,140,107,.25); }
    .sp.iris .sp-icon { color: var(--app-iris); border-color: rgba(107,140,140,.25); }
    .sp-name {
      font: 400 .62rem var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .sp-desc {
      font-size: .7rem;
      color: var(--app-muted);
      line-height: 1.35;
    }

    /* quick actions */
    .quick {
      border: 1px solid var(--app-line);
      border-top: none;
      margin-bottom: 24px;
    }
    .qa {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border-bottom: 1px solid var(--app-line);
      color: var(--app-text-2);
      text-decoration: none;
      font-size: .8rem;
      transition: background .12s;
      cursor: pointer;
      background: none;
      border-left: none; border-right: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }
    .qa:last-child { border-bottom: none; }
    .qa:active { background: rgba(255,255,255,.03); }
    .qa svg { width: 16px; height: 16px; color: var(--app-muted); flex-shrink: 0; }
    .qa-label { flex: 1; }
    .qa-arrow { color: var(--app-muted); font-size: .8rem; }

    /* activity */
    .act-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 8px;
      border-bottom: 1px solid var(--app-line);
    }
    .act-label {
      font: 300 .52rem var(--mono);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--app-muted);
    }
    .act-link {
      font: 300 .52rem var(--mono);
      letter-spacing: .04em;
      color: var(--app-gold-dim);
      text-decoration: none;
    }
    .act-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--app-line);
      cursor: pointer;
    }
    .act-row:active { opacity: .7; }
    .act-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--app-gold);
      flex-shrink: 0;
    }
    .act-body { flex: 1; min-width: 0; }
    .act-title {
      font-size: .82rem;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .act-meta {
      margin-top: 2px;
      font: 300 .52rem var(--mono);
      letter-spacing: .04em;
      color: var(--app-muted);
    }
    .act-chevron { color: var(--app-muted); font-size: .8rem; }
    .act-empty {
      padding: 20px 0;
      font: 300 .68rem var(--mono);
      color: var(--app-muted);
    }

    /* ── Page frame ── */
    .frame {
      position: absolute;
      inset: 0;
      border: 0;
      width: 100%;
      height: 100%;
      background: var(--app-bg);
    }
    .frame.off { display: none; }

    /* Loading overlay for iframe */
    .frame-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--app-bg);
      z-index: 5;
      transition: opacity .3s;
    }
    .frame-loading.done { opacity: 0; pointer-events: none; }
    .frame-loading .pulse {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--app-gold-dim);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }

    /* ── Bottom nav ── */
    .nav {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid var(--app-line-strong);
      background: rgba(5,5,5,.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 20;
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: var(--nav-h);
      color: var(--app-muted);
      background: none;
      border: none;
      cursor: pointer;
      font: 300 .48rem var(--mono);
      letter-spacing: .05em;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
      transition: color .15s;
    }
    .tab svg { width: 20px; height: 20px; }
    .tab.on { color: var(--app-gold); }
    .tab:active { opacity: .7; }

    /* ── More sheet ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed;
      left: 0; right: 0;
      bottom: 0;
      background: var(--app-surface);
      border-top: 1px solid var(--app-line-strong);
      z-index: 31;
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.32,.72,0,1);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--nav-h));
    }
    .sheet.show { transform: translateY(0); }
    .sheet-handle {
      display: flex;
      justify-content: center;
      padding: 10px 0 6px;
    }
    .sheet-handle::after {
      content: "";
      width: 36px; height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,.12);
    }
    .sheet-title {
      padding: 4px 18px 14px;
      font: 300 .56rem var(--mono);
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--app-muted);
    }
    .sheet-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border-top: 1px solid var(--app-line);
      color: var(--app-text-2);
      background: none;
      border-left: none; border-right: none; border-bottom: none;
      width: 100%;
      text-align: left;
      font: 300 .84rem var(--sans);
      cursor: pointer;
      transition: background .12s;
    }
    .sheet-item:active { background: rgba(255,255,255,.03); }
    .sheet-item svg { width: 18px; height: 18px; color: var(--app-muted); flex-shrink: 0; }
    .sheet-item.danger { color: var(--app-red); }
    .sheet-item.danger svg { color: var(--app-red); }
    .sheet-divider {
      height: 1px;
      background: var(--app-line-strong);
      margin: 4px 18px;
    }
  </style>
</head>
<body>
  <div class="shell">

    <!-- Header -->
    <header class="hdr">
      <div class="hdr-left">
        <button class="hdr-back" id="back-btn" onclick="goBack()" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div>
          <div class="hdr-title" id="hdr-title">Edge<b>K</b>eeper</div>
          <div class="hdr-sub" id="hdr-sub"></div>
        </div>
      </div>
      <div class="hdr-right">
        <div class="hdr-status">
          <span class="hdr-dot" id="hdr-dot"></span>
          <span id="hdr-status-text">Live</span>
        </div>
        <a class="hdr-avatar" id="avatar" aria-label="Profile">EK</a>
      </div>
    </header>

    <!-- Body -->
    <div class="body">
      <!-- Home dashboard -->
      <div class="home" id="home-view">
        <div class="home-inner">

          <div class="greet">
            <div class="greet-label" id="greet-label">Your practice, continued.</div>
            <h1 id="greet-headline">The work<br>is waiting.</h1>
            <p class="greet-sub" id="greet-sub">Your mentor, your rules, and the record of who you are becoming.</p>
          </div>

          <div class="spaces">
            <div class="spaces-label">Your spaces</div>
            <div class="spaces-grid">
              <button class="sp marcus" onclick="switchTab('marcus')">
                <span class="sp-icon">M</span>
                <span>
                  <span class="sp-name">Marcus</span>
                  <span class="sp-desc">Mentor office</span>
                </span>
              </button>
              <button class="sp theo" onclick="switchTab('theo')">
                <span class="sp-icon">T</span>
                <span>
                  <span class="sp-name">Theo</span>
                  <span class="sp-desc">Academy</span>
                </span>
              </button>
              <button class="sp iris" onclick="switchTab('iris')">
                <span class="sp-icon">I</span>
                <span>
                  <span class="sp-name">Iris</span>
                  <span class="sp-desc">Guardian</span>
                </span>
              </button>
            </div>
          </div>

          <div class="quick">
            <button class="qa" onclick="openPage('/reports.html', 'Reports')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16v16H4z"/><path d="M8 16V12M12 16V8M16 16v-2"/></svg>
              <span class="qa-label">Trading reports</span>
              <span class="qa-arrow">></span>
            </button>
            <button class="qa" onclick="openPage('/reviews.html', 'Reviews')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/><path d="M9 12h6M9 16h3"/></svg>
              <span class="qa-label">Trade reviews</span>
              <span class="qa-arrow">></span>
            </button>
            <button class="qa" onclick="openPage('/integrations.html', 'Integrations')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.6 13.5 15.4 17M8.6 10.5l6.8-3.5"/></svg>
              <span class="qa-label">Broker integrations</span>
              <span class="qa-arrow">></span>
            </button>
          </div>

          <div>
            <div class="act-head">
              <span class="act-label">Recent activity</span>
              <button class="act-link" onclick="switchTab('marcus')" style="background:none;border:none;cursor:pointer;font:inherit;color:inherit">View all</button>
            </div>
            <div id="activity">
              <div class="act-empty">Restoring your record...</div>
            </div>
          </div>

        </div>
      </div>

      <!-- Page iframe -->
      <iframe class="frame off" id="page-frame" src="about:blank" title="Page content"></iframe>
      <div class="frame-loading done" id="frame-loader"><div class="pulse"></div></div>
    </div>

    <!-- Bottom nav -->
    <nav class="nav" id="app-nav">
      <button class="tab on" data-tab="home" onclick="switchTab('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10.5 12 3l9 7.5v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 20v-6h6v6"/></svg>
        Home
      </button>
      <button class="tab" data-tab="marcus" onclick="switchTab('marcus')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
        Marcus
      </button>
      <button class="tab" data-tab="theo" onclick="switchTab('theo')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 10 9-5 9 5-9 5z"/><path d="M7 12v5c3 2 7 2 10 0v-5"/></svg>
        Theo
      </button>
      <button class="tab" data-tab="iris" onclick="switchTab('iris')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3 20 7v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>
        Iris
      </button>
      <button class="tab" data-tab="more" onclick="toggleMore()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        More
      </button>
    </nav>

    <!-- More sheet -->
    <div class="overlay" id="overlay" onclick="closeMore()"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">More</div>
      <button class="sheet-item" onclick="openPage('/profile.html', 'Profile')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3 3-6 7-6s7 3 7 6"/></svg>
        Trader profile
      </button>
      <button class="sheet-item" onclick="openPage('/reports.html', 'Reports')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16v16H4z"/><path d="M8 16V12M12 16V8M16 16v-2"/></svg>
        Reports
      </button>
      <button class="sheet-item" onclick="openPage('/reviews.html', 'Reviews')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/><path d="M9 12h6M9 16h3"/></svg>
        Trade reviews
      </button>
      <button class="sheet-item" onclick="openPage('/integrations.html', 'Integrations')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.6 13.5 15.4 17M8.6 10.5l6.8-3.5"/></svg>
        Broker integrations
      </button>
      <button class="sheet-item" onclick="openPage('/settings.html', 'Settings')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Settings
      </button>
      <div class="sheet-divider"></div>
      <button class="sheet-item danger" onclick="signOut()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>

  </div>

  <script>
    var TAB_URLS = {
      marcus: '/workspace.html?app=1',
      theo:   '/my-academy?app=1',
      iris:   '/chamber?app=1'
    };
    var TAB_NAMES = {
      home: 'EdgeKeeper',
      marcus: 'Marcus',
      theo: 'Academy',
      iris: 'Guardian'
    };

    var activeTab = 'home';
    var subPage = null; // {url, title} when navigated from More menu

    var frame     = document.getElementById('page-frame');
    var homeView  = document.getElementById('home-view');
    var loader    = document.getElementById('frame-loader');
    var hdrTitle  = document.getElementById('hdr-title');
    var hdrSub    = document.getElementById('hdr-sub');
    var backBtn   = document.getElementById('back-btn');
    var overlay   = document.getElementById('overlay');
    var sheet     = document.getElementById('sheet');
    var tabs      = document.querySelectorAll('.tab');

    function switchTab(id) {
      if (id === activeTab && !subPage) return;
      closeMore();
      subPage = null;

      activeTab = id;
      updateTabHighlight();

      backBtn.classList.remove('show');
      hdrSub.classList.remove('show');

      if (id === 'home') {
        hdrTitle.innerHTML = 'Edge<b>K</b>eeper';
        homeView.classList.remove('off');
        frame.classList.add('off');
        loader.classList.add('done');
      } else {
        hdrTitle.textContent = TAB_NAMES[id] || id;
        homeView.classList.add('off');
        frame.classList.remove('off');
        showLoader();
        frame.src = TAB_URLS[id];
      }
    }

    function openPage(url, title) {
      closeMore();
      subPage = { url: url, title: title };
      activeTab = 'more';
      updateTabHighlight();

      hdrTitle.textContent = title;
      backBtn.classList.add('show');
      hdrSub.classList.remove('show');

      homeView.classList.add('off');
      frame.classList.remove('off');
      showLoader();
      frame.src = url + (url.indexOf('?') > -1 ? '&' : '?') + 'app=1';
    }

    function goBack() {
      subPage = null;
      switchTab('home');
    }

    function showLoader() {
      loader.classList.remove('done');
    }
    frame.addEventListener('load', function() {
      setTimeout(function() { loader.classList.add('done'); }, 150);
    });

    function updateTabHighlight() {
      tabs.forEach(function(t) {
        t.classList.toggle('on', t.getAttribute('data-tab') === activeTab);
      });
    }

    function toggleMore() {
      if (sheet.classList.contains('show')) {
        closeMore();
      } else {
        overlay.classList.add('show');
        sheet.classList.add('show');
      }
    }
    function closeMore() {
      overlay.classList.remove('show');
      sheet.classList.remove('show');
    }

    // Connection status
    function syncStatus() {
      var on = navigator.onLine;
      document.getElementById('hdr-dot').classList.toggle('off', !on);
      document.getElementById('hdr-status-text').textContent = on ? 'Live' : 'Offline';
    }
    addEventListener('online', syncStatus);
    addEventListener('offline', syncStatus);
    syncStatus();

    // Profile + activity
    fetch('/api/profile', { credentials: 'include' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        var p = data && data.profile; if (!p) return;
        var name = p.display_name || (p.email || '').split('@')[0] || '';
        if (name) {
          document.getElementById('greet-label').textContent = 'Welcome back, ' + name + '.';
          document.getElementById('greet-headline').innerHTML = 'Return to<br>the work.';
          document.getElementById('avatar').textContent = name.slice(0, 2).toUpperCase();
          document.getElementById('avatar').href = 'javascript:void(0)';
          document.getElementById('avatar').onclick = function() { openPage('/profile.html', 'Profile'); };
        }
      }).catch(function() {});

    fetch('/api/messages', { credentials: 'include' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        var msgs = (data && data.messages) || [];
        var el = document.getElementById('activity');
        if (!msgs.length) {
          el.innerHTML = '<div class="act-empty">No activity yet. Your record is quiet.</div>';
          return;
        }
        el.innerHTML = msgs.slice(0, 4).map(function(m) {
          var text = (m.content || '').replace(/[<>]/g, '');
          if (text.length > 80) text = text.slice(0, 77) + '...';
          var d = new Date(m.created_at);
          var day = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          return '<div class="act-row" onclick="switchTab(\'marcus\')">' +
            '<span class="act-dot"></span>' +
            '<span class="act-body">' +
              '<span class="act-title">' + (text || 'A message from your mentor.') + '</span>' +
              '<span class="act-meta">' + (m.mentor || 'MARCUS').toUpperCase() + ' · ' + day + '</span>' +
            '</span>' +
            '<span class="act-chevron">›</span>' +
          '</div>';
        }).join('');
      }).catch(function() {
        document.getElementById('activity').innerHTML = '<div class="act-empty">Activity appears when connected.</div>';
      });

    // Sign out
    function signOut() {
      closeMore();
      fetch('/api/auth/session', { method: 'DELETE', credentials: 'include' })
        .then(function() { location.href = '/edgekeeper.html'; })
        .catch(function() { location.href = '/edgekeeper.html'; });
    }
  </script>
</body>
</html>
