<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#050505">
  <title>EdgeKeeper</title>
  <link rel="stylesheet" href="/assets/shared.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --surface: #0a0a09;
      --surface-2: #0f0e0c;
      --line: rgba(232,228,220,.06);
      --line-2: rgba(232,228,220,.1);
      --line-3: rgba(232,228,220,.16);
      --text: #e8e4dc;
      --text-2: #bfbab2;
      --muted: #5e5a55;
      --faint: #3a3835;
      --gold: #b8a06a;
      --gold-dim: #7a6a45;
      --gold-glow: rgba(184,160,106,.08);
      --green: #6b8c6b;
      --green-dim: #3d5a3d;
      --teal: #6b8c8c;
      --teal-dim: #3d5a5a;
      --red: #9d6c58;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
      --mono: 'DM Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    .shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-top: env(safe-area-inset-top, 0px);
    }

    /* ── Header ── */
    .hdr {
      flex-shrink: 0;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(5,5,5,.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      z-index: 10;
    }
    .hdr-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .hdr-mark {
      font: 400 .72rem var(--serif);
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .hdr-mark em { font-style: normal; color: var(--gold-dim); }
    .hdr-right { display: flex; align-items: center; gap: 14px; }
    .hdr-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(107,140,107,.5);
      transition: background .3s, box-shadow .3s;
    }
    .hdr-dot.off { background: var(--red); box-shadow: 0 0 6px rgba(157,108,88,.4); }
    .hdr-initial {
      font: 400 .58rem var(--mono);
      color: var(--gold-dim);
      letter-spacing: .04em;
      cursor: pointer;
      text-decoration: none;
    }

    /* ── Body ── */
    .body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Greeting ── */
    .hi {
      padding: 32px 20px 0;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }
    .hi::before {
      content: "";
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 360px; height: 300px;
      background: radial-gradient(ellipse at 50% 20%, rgba(184,160,106,.06), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    .hi > * { position: relative; z-index: 1; }
    .hi-time {
      font: 300 .5rem var(--mono);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 20px;
    }
    .hi-name {
      font: 300 clamp(2rem, 9vw, 3rem)/1 var(--serif);
      color: var(--text);
      margin-bottom: 6px;
    }
    .hi-line {
      font: 300 italic clamp(.95rem, 3.5vw, 1.1rem)/1.5 var(--serif);
      color: var(--muted);
      margin-bottom: 40px;
    }

    /* ── Spaces ── */
    .spaces {
      padding: 0 20px;
      max-width: 480px;
      margin: 0 auto 32px;
    }
    .sp {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      background: none; border-left: none; border-right: none; border-top: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      color: inherit;
      text-decoration: none;
      transition: opacity .12s;
    }
    .sp:first-child { border-top: 1px solid var(--line); }
    .sp:active { opacity: .65; }
    .sp-glyph {
      width: 44px; height: 44px;
      display: grid; place-items: center;
      font: 400 1.3rem var(--serif);
      line-height: 1;
      border: 1px solid var(--line-2);
      flex-shrink: 0;
      transition: border-color .2s;
    }
    .sp:active .sp-glyph { border-color: var(--line-3); }
    .sp.marcus .sp-glyph { color: var(--gold); border-color: rgba(184,160,106,.18); }
    .sp.theo .sp-glyph   { color: var(--green); border-color: rgba(107,140,107,.18); }
    .sp.iris .sp-glyph   { color: var(--teal); border-color: rgba(107,140,140,.18); }
    .sp-text { flex: 1; min-width: 0; }
    .sp-name {
      font: 400 .86rem var(--sans);
      letter-spacing: .01em;
      margin-bottom: 2px;
    }
    .sp-role {
      font: 300 .68rem var(--mono);
      color: var(--muted);
      letter-spacing: .04em;
    }
    .sp-arrow {
      color: var(--faint);
      font-size: .7rem;
      flex-shrink: 0;
      transition: color .15s;
    }
    .sp:active .sp-arrow { color: var(--muted); }

    /* ── Divider ── */
    .sep { max-width: 480px; margin: 0 auto; padding: 0 20px; }
    .sep-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line-2) 30%, var(--line-2) 70%, transparent);
    }

    /* ── Quick row ── */
    .quick-row {
      display: flex;
      gap: 1px;
      padding: 0 20px;
      max-width: 480px;
      margin: 20px auto 28px;
    }
    .qr {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 4px;
      background: var(--surface);
      cursor: pointer;
      border: none;
      color: var(--text-2);
      font-family: inherit;
      text-decoration: none;
      transition: background .12s;
    }
    .qr:first-child { border-radius: 2px 0 0 2px; }
    .qr:last-child { border-radius: 0 2px 2px 0; }
    .qr:active { background: var(--surface-2); }
    .qr svg { width: 16px; height: 16px; color: var(--muted); }
    .qr-label {
      font: 300 .5rem var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Activity ── */
    .act {
      padding: 0 20px;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    }
    .act-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0;
      padding-bottom: 10px;
    }
    .act-label {
      font: 300 .5rem var(--mono);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .act-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 0;
      border-top: 1px solid var(--line);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .act-row:active { opacity: .6; }
    .act-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--gold-dim);
      flex-shrink: 0;
    }
    .act-body { flex: 1; min-width: 0; }
    .act-title {
      font: 300 .8rem var(--sans);
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-2);
    }
    .act-meta {
      margin-top: 2px;
      font: 300 .48rem var(--mono);
      letter-spacing: .04em;
      color: var(--faint);
    }
    .act-empty {
      padding: 18px 0;
      font: 300 .64rem var(--mono);
      color: var(--faint);
    }

    /* ── Nav ── */
    .nav {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid var(--line-2);
      background: rgba(4,4,4,.92);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      z-index: 20;
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 54px;
      color: var(--faint);
      background: none; border: none; cursor: pointer;
      font: 300 .44rem var(--mono);
      letter-spacing: .04em;
      text-transform: uppercase;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: color .15s;
    }
    .tab svg { width: 19px; height: 19px; }
    .tab.on { color: var(--gold); }
    .tab:active { opacity: .6; }

    /* ── Sheet ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 30;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--line-2);
      border-radius: 14px 14px 0 0;
      z-index: 31;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 60px);
    }
    .sheet.show { transform: translateY(0); }
    .sheet-grip {
      display: flex; justify-content: center;
      padding: 10px 0 4px;
    }
    .sheet-grip::after {
      content: "";
      width: 32px; height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,.08);
    }
    .sheet-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-top: 1px solid var(--line);
      color: var(--text-2);
      background: none;
      border-left: none; border-right: none; border-bottom: none;
      width: 100%;
      text-align: left;
      font: 300 .84rem var(--sans);
      cursor: pointer;
      text-decoration: none;
      transition: background .12s;
    }
    .sheet-item:first-of-type { border-top: none; margin-top: 6px; }
    .sheet-item:active { background: rgba(255,255,255,.02); }
    .sheet-item svg { width: 17px; height: 17px; color: var(--muted); flex-shrink: 0; }
    .sheet-item.out { color: var(--red); margin-top: 8px; border-top: 1px solid var(--line-2); }
    .sheet-item.out svg { color: var(--red); }
  </style>
</head>
<body>
  <div class="shell">

    <header class="hdr">
      <div class="hdr-left">
        <span class="hdr-mark">edge<em>k</em>eeper</span>
      </div>
      <div class="hdr-right">
        <span class="hdr-dot" id="hdr-dot"></span>
        <a class="hdr-initial" id="hdr-initial" href="/profile.html"></a>
      </div>
    </header>

    <div class="body">

      <div class="hi">
        <div class="hi-time" id="hi-time"></div>
        <h1 class="hi-name" id="hi-name">EdgeKeeper</h1>
        <p class="hi-line" id="hi-line">Your practice, continued.</p>
      </div>

      <div class="spaces">
        <a class="sp marcus" href="/workspace.html">
          <span class="sp-glyph">M</span>
          <span class="sp-text">
            <div class="sp-name">Marcus</div>
            <div class="sp-role">Your mentor</div>
          </span>
          <span class="sp-arrow">&#x203A;</span>
        </a>
        <a class="sp theo" href="/my-academy">
          <span class="sp-glyph">T</span>
          <span class="sp-text">
            <div class="sp-name">Theo</div>
            <div class="sp-role">The academy</div>
          </span>
          <span class="sp-arrow">&#x203A;</span>
        </a>
        <a class="sp iris" href="/chamber">
          <span class="sp-glyph">I</span>
          <span class="sp-text">
            <div class="sp-name">Iris</div>
            <div class="sp-role">Risk guardian</div>
          </span>
          <span class="sp-arrow">&#x203A;</span>
        </a>
      </div>

      <div class="sep"><div class="sep-line"></div></div>

      <div class="quick-row">
        <a class="qr" href="/reports.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16v16H4z"/><path d="M8 16V12M12 16V8M16 16v-2"/></svg>
          <span class="qr-label">Reports</span>
        </a>
        <a class="qr" href="/reviews.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M9 12h6M9 16h3"/></svg>
          <span class="qr-label">Reviews</span>
        </a>
        <a class="qr" href="/integrations.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.6 13.5 15.4 17M8.6 10.5l6.8-3.5"/></svg>
          <span class="qr-label">Brokers</span>
        </a>
        <a class="qr" href="/settings.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <span class="qr-label">Settings</span>
        </a>
      </div>

      <div class="act">
        <div class="act-head">
          <span class="act-label">Recent</span>
        </div>
        <div id="activity"><div class="act-empty">Restoring your record...</div></div>
      </div>

    </div>

    <nav class="nav">
      <a class="tab on" href="/app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10.5 12 3l9 7.5v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 20v-6h6v6"/></svg>
        Home
      </a>
      <a class="tab" href="/workspace.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>
        Marcus
      </a>
      <a class="tab" href="/my-academy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m3 10 9-5 9 5-9 5z"/><path d="M7 12v5c3 2 7 2 10 0v-5"/></svg>
        Theo
      </a>
      <a class="tab" href="/chamber">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3 20 7v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>
        Iris
      </a>
      <button class="tab" onclick="toggleMore()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        More
      </button>
    </nav>

    <div class="overlay" id="overlay" onclick="closeMore()"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-grip"></div>
      <a class="sheet-item" href="/profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3 3-6 7-6s7 3 7 6"/></svg>
        Trader profile
      </a>
      <a class="sheet-item" href="/reports.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16v16H4z"/><path d="M8 16V12M12 16V8M16 16v-2"/></svg>
        Reports
      </a>
      <a class="sheet-item" href="/reviews.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M9 12h6M9 16h3"/></svg>
        Trade reviews
      </a>
      <a class="sheet-item" href="/integrations.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.6 13.5 15.4 17M8.6 10.5l6.8-3.5"/></svg>
        Broker integrations
      </a>
      <a class="sheet-item" href="/settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        Settings
      </a>
      <button class="sheet-item out" onclick="signOut()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>

  </div>

  <script>
    function toggleMore() {
      var s = document.getElementById('sheet');
      var o = document.getElementById('overlay');
      if (s.classList.contains('show')) { closeMore(); }
      else { o.classList.add('show'); s.classList.add('show'); }
    }
    function closeMore() {
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('sheet').classList.remove('show');
    }

    function sync() {
      document.getElementById('hdr-dot').classList.toggle('off', !navigator.onLine);
    }
    addEventListener('online', sync); addEventListener('offline', sync); sync();

    (function() {
      var h = new Date().getHours();
      var g = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
      document.getElementById('hi-time').textContent = g;
    })();

    fetch('/api/profile', { credentials: 'include' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(d) {
        var p = d && d.profile; if (!p) return;
        var name = p.display_name || (p.email || '').split('@')[0] || '';
        if (!name) return;
        var first = name.split(' ')[0];
        document.getElementById('hi-name').textContent = first + '.';
        document.getElementById('hi-line').textContent = 'The work is where you left it.';
        document.getElementById('hdr-initial').textContent = name.slice(0,2).toUpperCase();
      }).catch(function() {});

    fetch('/api/messages', { credentials: 'include' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(d) {
        var msgs = (d && d.messages) || [];
        var el = document.getElementById('activity');
        if (!msgs.length) {
          el.innerHTML = '<div class="act-empty">Your record is quiet.</div>';
          return;
        }
        el.innerHTML = msgs.slice(0, 4).map(function(m) {
          var t = (m.content || '').replace(/[<>]/g, '');
          if (t.length > 72) t = t.slice(0, 70) + '…';
          var day = new Date(m.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          return '<a class="act-row" href="/workspace.html">' +
            '<span class="act-dot"></span>' +
            '<span class="act-body">' +
              '<span class="act-title">' + (t || 'A message from your mentor.') + '</span>' +
              '<span class="act-meta">' + (m.mentor || 'marcus').toUpperCase() + ' · ' + day + '</span>' +
            '</span></a>';
        }).join('');
      }).catch(function() {
        document.getElementById('activity').innerHTML = '<div class="act-empty">Activity appears when connected.</div>';
      });

    function signOut() {
      closeMore();
      fetch('/api/auth/session', { method: 'DELETE', credentials: 'include' })
        .then(function() { location.href = '/edgekeeper.html'; })
        .catch(function() { location.href = '/edgekeeper.html'; });
    }
  </script>
</body>
</html>
