<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>More — EdgeKeeper</title>
  <link rel="stylesheet" href="/assets/shared.css" />
  <style>
    :root {
      --bg:#050505; --surface:#0e0e10; --border:rgba(255,255,255,.08);
      --text:#e8e8ea; --muted:rgba(255,255,255,.5); --accent:#b8a06a;
      --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',sans-serif; --mono:'DM Mono',monospace;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:var(--sans); font-weight:300; min-height:100dvh; -webkit-font-smoothing:antialiased; }
    .wrap { max-width:560px; margin:0 auto; padding:30px 20px 100px; }
    .more-h { font-family:var(--serif); font-weight:300; font-size:2rem; letter-spacing:.01em; margin:4px 2px 22px; }
    .more-sec { font-family:var(--mono); font-size:.52rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); padding:0 4px 10px; }
    .more-list { display:flex; flex-direction:column; border:1px solid var(--border); border-radius:6px; overflow:hidden; background:var(--surface); }
    .more-list + .more-sec { margin-top:26px; }
    .more-row { display:flex; align-items:center; gap:15px; padding:17px 18px; color:var(--text); text-decoration:none; border:none; border-bottom:1px solid var(--border); background:none; cursor:pointer; font-family:var(--sans); font-size:.92rem; font-weight:300; text-align:left; width:100%; transition:background .15s; }
    .more-row:last-child { border-bottom:none; }
    .more-row:hover, .more-row:active { background:rgba(255,255,255,.035); }
    .more-row > svg { width:19px; height:19px; color:var(--muted); flex-shrink:0; }
    .more-row .chev { width:16px; height:16px; margin-left:auto; color:var(--muted); opacity:.5; }
    .more-row.out { color:#c9796a; } .more-row.out > svg { color:#c9796a; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="more-h">More</h1>

    <div class="more-sec">Your record</div>
    <div class="more-list">
      <a class="more-row" href="/profile.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M5 20c0-3 3-6 7-6s7 3 7 6"/></svg>
        Trader profile
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a class="more-row" href="/reports.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16v16H4z"/><path d="M8 16V12M12 16V8M16 16v-2"/></svg>
        Reports
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a class="more-row" href="/reviews.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M9 12h6M9 16h3"/></svg>
        Trade reviews
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </div>

    <div class="more-sec">Account</div>
    <div class="more-list">
      <a class="more-row" href="/integrations.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.6 13.5 15.4 17M8.6 10.5l6.8-3.5"/></svg>
        Broker integrations
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <a class="more-row" href="/settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        Settings
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </a>
      <button class="more-row out" onclick="fetch('/api/auth/session',{method:'DELETE',credentials:'include'}).then(function(){location.href='/auth.html'})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </div>
</body>
</html>
