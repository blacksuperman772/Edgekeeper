<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Offline | EdgeKeeper</title>
  <style>
    :root { color-scheme: dark; --gold: #b8a06a; --text: #d4d0c8; --muted: #888; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 48px 24px; display: grid; place-items: center; background: #050505; color: var(--text); font-family: Georgia, serif; text-align: center; }
    main { max-width: 440px; }
    h1 { margin: 0 0 16px; color: var(--gold); font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 400; letter-spacing: .08em; text-transform: uppercase; }
    p { margin: 0; color: var(--muted); font: 14px/1.7 'DM Mono', monospace; }
  </style>
</head>
<body><main><h1>Connection paused</h1><p>EdgeKeeper needs a connection for this space. Return when you are online and the institution will be here.</p></main></body>
</html>
